name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo build --profile dist --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cross build --profile dist --target ${{ matrix.target }}

      - name: Package
        run: |
          BIN=target/${{ matrix.target }}/dist/talkd
          strip "$BIN" 2>/dev/null || true
          tar czf talkd-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/dist talkd
          ls -lh talkd-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkd-${{ matrix.target }}
          path: talkd-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums-sha256.txt
          generate_release_notes: true
          body: |
            ## Install

            **macOS (Apple Silicon)**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/talkd-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv talkd /usr/local/bin/
            ```

            **macOS (Intel)**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/talkd-x86_64-apple-darwin.tar.gz | tar xz
            sudo mv talkd /usr/local/bin/
            ```

            **Linux (x86_64)**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/talkd-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv talkd /usr/local/bin/
            ```

            **Linux (aarch64)**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/talkd-aarch64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv talkd /usr/local/bin/
            ```
